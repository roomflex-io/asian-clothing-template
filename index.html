<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/basket.css" />
  <link rel="stylesheet" href="css/photos.css" />
  <link rel="stylesheet" href="css/header-order.css" />
  <link rel="stylesheet" href="css/shop-ui.css" />
</head>
<body data-page="home">
  <header>
    <div class="wrap nav">
      <button class="burger" data-burger type="button" aria-label="Menu">☰</button>
      <a class="logo" href="index.html" data-shop-name>Shop<span data-tagline></span></a>
      <nav class="links" data-nav></nav>
      <div class="basket-slot" data-basket-slot></div>
    </div>
  </header>
  <main class="wrap">
    <section class="hero hero-simple">
      <div>
        <p class="kicker" data-tagline>New pieces</p>
        <h1 data-shop-name>The shop</h1>
        <p>Browse the edit, add a piece, check out when you are ready.</p>
        <div class="btns">
          <a class="btn solid" href="shop.html">Shop now</a>
          <a class="btn ghost" href="contact.html">Visit</a>
        </div>
      </div>
    </section>
    <section class="home-edit">
      <div class="section-head">
        <h2>In the shop</h2>
        <a class="quiet-link" href="shop.html">See all</a>
      </div>
      <div class="grid" data-home-grid></div>
    </section>
  </main>
  <footer>
    <div class="wrap foot">
      <div><strong data-shop-name></strong><br /><span data-address></span><br /><span data-phone></span></div>
      <div><a href="contact.html">Visit</a> · <a href="privacy.html">Privacy</a><br />© <span data-year></span></div>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/photos.js"></script>
  <script src="js/config.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/render-cards.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/hub.js"></script>
  <script src="js/storefront.js"></script>
  <script>Hub.boot();</script>
</body>
</html>
