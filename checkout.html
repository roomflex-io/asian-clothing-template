<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/basket.css" />
  <link rel="stylesheet" href="css/header-order.css" />
  <link rel="stylesheet" href="css/studio.css" />
</head>
<body data-page="checkout">
  <header>
    <div class="wrap nav">
      <a class="logo" href="index.html" data-shop-name>Noor Atelier<span>Checkout</span></a>
    </div>
  </header>
  <main class="wrap studio">
    <p class="kicker">Checkout</p>
    <h1>Your details</h1>
    <p class="lead">Guest is fine. Or log in to save the order to an account.</p>
    <div class="product-form" data-account style="margin-bottom:24px">
      <label>Account email<input data-acc-email type="email" /></label>
      <label>Password<input data-acc-pass type="password" /></label>
      <div class="btns">
        <button class="btn ghost" type="button" data-acc-login>Log in</button>
        <button class="btn ghost" type="button" data-acc-signup>Create account</button>
      </div>
      <p data-acc-msg></p>
    </div>
    <form class="product-form" data-check>
      <label>Name<input name="name" required /></label>
      <label>Email<input name="email" type="email" required /></label>
      <label>Phone<input name="phone" required /></label>
      <label>Collect or deliver
        <select name="fulfillment">
          <option value="collect">Collect in store</option>
          <option value="deliver">Deliver</option>
        </select>
      </label>
      <label>Address<input name="address" /></label>
      <div class="two">
        <label>City<input name="city" /></label>
        <label>Postcode<input name="postcode" /></label>
      </div>
      <label>Note<textarea name="note"></textarea></label>
      <label>Pay
        <select name="payment">
          <option value="collect">Pay on collection</option>
          <option value="stripe">Card / Apple Pay / Google Pay</option>
        </select>
      </label>
      <p data-sum></p>
      <p class="err" data-err></p>
      <button class="btn solid" type="submit">Place order</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/hub.js"></script>
  <script src="js/storefront.js"></script>
  <script src="js/checkout.js"></script>
  <script>Hub.boot();</script>
</body>
</html>
