<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/basket.css" />
  <link rel="stylesheet" href="css/header-order.css" />
  <style>
    .visit { padding: 28px 0 72px; display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: start; }
    .visit h1 { font-size: clamp(2.4rem, 5vw, 3.8rem); font-weight: 500; line-height: 0.95; margin: 8px 0 18px; }
    .lead { font-family: "DM Sans", sans-serif; color: var(--muted); line-height: 1.65; max-width: 38ch; }
    .panel { background: #fffaf4; border: 1px solid var(--line); padding: 28px; }
    .row-c { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); font-family: "DM Sans", sans-serif; font-size: 0.92rem; }
    .row-c:last-child { border-bottom: 0; }
    .row-c dt { letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.68rem; color: var(--muted); padding-top: 4px; }
    .row-c a { border-bottom: 1px solid transparent; }
    .row-c a:hover { border-bottom-color: var(--ink); }
    .map {
      margin-top: 16px; min-height: 220px;
      background: linear-gradient(165deg, #2a221c, #6b5340 55%, #c4a574);
      color: var(--cream); display: flex; align-items: flex-end; padding: 20px;
      font-family: "DM Sans", sans-serif; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase;
    }
    @media (max-width: 800px) { .visit { grid-template-columns: 1fr; gap: 28px; } }
  </style>
</head>
<body data-page="contact">
  <header>
    <div class="wrap nav">
      <button class="burger" data-burger type="button" aria-label="Menu">☰</button>
      <a class="logo" href="index.html" data-shop-name>Shop<span data-tagline></span></a>
      <nav class="links" data-nav></nav>
      <div class="basket-slot" data-basket-slot></div>
    </div>
  </header>
  <main class="wrap visit">
    <div>
      <p class="kicker">Visit</p>
      <h1>Come in,<br />or message first.</h1>
      <p class="lead">Find <span data-shop-name>the shop</span> using the details on the right. Fittings by appointment.</p>
      <div class="btns">
        <a class="btn solid" data-wa>WhatsApp the shop</a>
        <a class="btn ghost" data-ig>Instagram</a>
      </div>
    </div>
    <div class="panel">
      <dl>
        <div class="row-c"><dt>Shop</dt><dd data-shop-name></dd></div>
        <div class="row-c"><dt>Address</dt><dd data-address></dd></div>
        <div class="row-c"><dt>Phone</dt><dd data-phone></dd></div>
        <div class="row-c"><dt>Email</dt><dd data-email></dd></div>
      </dl>
      <div class="map" data-address></div>
    </div>
  </main>
  <footer>
    <div class="wrap foot">
      <div><strong data-shop-name></strong><br /><span data-address></span></div>
      <div><a href="privacy.html">Privacy</a> · © <span data-year></span></div>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/hub.js"></script>
  <script src="js/storefront.js"></script>
  <script>Hub.boot();</script>
</body>
</html>
