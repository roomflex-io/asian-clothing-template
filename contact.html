<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Noor Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="contact">
  <header>
    <div class="wrap nav">
      <a class="logo" href="index.html" data-shop-name>Noor Atelier<span data-tagline></span></a>
      <button class="burger" data-burger aria-label="Menu">☰</button>
      <nav class="links" data-nav></nav>
    </div>
  </header>

  <main class="wrap">
    <div class="page-hero">
      <p class="kicker">Visit & enquire</p>
      <h1>Contact us</h1>
    </div>
    <section style="display:grid;grid-template-columns:1fr 1fr;gap:40px;">
      <div>
        <p class="sans" style="color:var(--muted);line-height:1.6;margin-bottom:20px;">
          Appointments for wedding and lehenga fittings. Everyday abayas, thobes and attar — walk in or message first.
        </p>
        <p class="sans"><strong>Address</strong><br /><span data-address></span></p>
        <p class="sans" style="margin-top:12px;"><strong>Phone</strong><br /><span data-phone></span></p>
        <p class="sans" style="margin-top:12px;"><strong>Email</strong><br /><span data-email></span></p>
        <div class="btns">
          <a class="btn solid" data-wa>WhatsApp</a>
          <a class="btn ghost" data-ig>Instagram</a>
        </div>
      </div>
      <form onsubmit="event.preventDefault(); alert('Hook this form to email or Formspree when you go live.');">
        <label>Name<input name="name" required /></label>
        <label>Email or WhatsApp<input name="contact" required /></label>
        <label>About
          <select name="about">
            <option>General</option>
            <option>Wedding / lehenga</option>
            <option>Abaya</option>
            <option>Thobe</option>
            <option>Perfume</option>
            <option>Order / pickup</option>
          </select>
        </label>
        <label>Message<textarea name="msg" required></textarea></label>
        <button class="btn solid" type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <div class="wrap foot">
      <div><strong data-shop-name></strong></div>
      <div><a href="privacy.html">Privacy</a> · © <span data-year></span></div>
    </div>
  </footer>
  <script src="js/config.js"></script>
  <script src="js/nav.js"></script>
  <style>
    @media (max-width:700px){ main section { grid-template-columns:1fr !important; } }
  </style>
</body>
</html>
